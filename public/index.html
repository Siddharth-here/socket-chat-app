<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket Chat</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #10131a;
            --panel: #191e28;
            --panel-light: #222937;
            --border: #30394a;
            --text: #f1f5f9;
            --muted: #9ba7b8;
            --accent: #65d6a0;
            --accent-dark: #183e32;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at top left, #263344 0, var(--background) 42%);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        .chat-shell {
            width: min(100%, 760px);
            height: min(720px, calc(100vh - 48px));
            min-height: 500px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 24px 70px rgb(0 0 0 / 35%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 22px 26px;
            border-bottom: 1px solid var(--border);
        }

        .heading {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: var(--accent);
            color: #10241c;
            font-size: 20px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            font-size: 1.35rem;
            letter-spacing: 0.02em;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font: 0.78rem/1.2 system-ui, sans-serif;
        }

        .status::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e4aa58;
        }

        .status.connected::before {
            background: var(--accent);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 24px 26px;
            list-style: none;
            margin: 0;
        }

        .message {
            align-self: flex-start;
            max-width: min(80%, 520px);
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 4px 14px 14px 14px;
            background: var(--panel-light);
            font-size: 1rem;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .message.mine {
            align-self: flex-end;
            border-color: transparent;
            border-radius: 14px 4px 14px 14px;
            background: var(--accent-dark);
        }

        .empty-state {
            margin: auto;
            color: var(--muted);
            font-size: 1.1rem;
            text-align: center;
        }

        form {
            display: flex;
            gap: 10px;
            padding: 18px 26px 22px;
            border-top: 1px solid var(--border);
        }

        input {
            min-width: 0;
            flex: 1;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: #11151d;
            color: var(--text);
            font: 1rem Georgia, "Times New Roman", serif;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgb(101 214 160 / 14%);
        }

        button {
            padding: 0 20px;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: #10241c;
            cursor: pointer;
            font: bold 0.95rem system-ui, sans-serif;
        }

        button:hover {
            background: #82e2b4;
        }

        @media (max-width: 560px) {
            body {
                padding: 0;
            }

            .chat-shell {
                width: 100%;
                height: 100vh;
                min-height: 0;
                border: 0;
                border-radius: 0;
            }

            header, form {
                padding-left: 18px;
                padding-right: 18px;
            }

            #messages {
                padding: 20px 18px;
            }
        }
    </style>
</head>
<body>
    <main class="chat-shell">
        <header>
            <div class="heading">
                <div class="mark" aria-hidden="true">↗</div>
                <h1>Open chat</h1>
            </div>
            <div class="status" id="connection-status">Connecting</div>
        </header>

        <ul id="messages" aria-live="polite">
            <li class="empty-state" id="empty-state">Start the conversation.</li>
        </ul>

        <form id="chat-form">
            <input id="message-input" autocomplete="off" placeholder="Write a message..." aria-label="Message" required>
            <button type="submit">Send</button>
        </form>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.querySelector("#chat-form");
        const input = document.querySelector("#message-input");
        const messages = document.querySelector("#messages");
        const emptyState = document.querySelector("#empty-state");
        const status = document.querySelector("#connection-status");

        function addMessage(text, ownMessage = false) {
            emptyState?.remove();

            const message = document.createElement("li");
            message.className = `message${ownMessage ? " mine" : ""}`;
            message.textContent = text;
            messages.append(message);
            messages.scrollTop = messages.scrollHeight;
        }

        function onMessageinput(message) {
            addMessage(message);
            console.log({message: text});
            
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, true);
            socket.emit("chat message", text);
            input.value = "";
            input.focus();
            onMessageinput(text)
        });

        socket.on("chat message", onMessageinput);
        socket.on("connect", () => {
            status.textContent = "Connected";
            status.classList.add("connected");
        });
        socket.on("disconnect", () => {
            status.textContent = "Disconnected";
            status.classList.remove("connected");
        });
    </script>
</body>
</html>
